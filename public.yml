---
- name: Setup système
  hosts: local
  become: false

  vars_prompt:
    # Sert deux usages : le `become` d'Ansible pour les tâches pacman, et le
    # canal askpass pour les appels sudo internes de yay/makepkg (rôle
    # sudo_askpass). Un seul prompt, `unsafe` pour qu'un mot de passe
    # contenant {{ }} ne soit pas interprété comme du Jinja.
    - name: become_password
      prompt: "Mot de passe sudo"
      private: true
      unsafe: true

    - name: install_dev
      prompt: "Installer l'environnement dev (neovim, plugins, parsers) ? [yes/no]"
      default: "no"
      private: false

    - name: install_android_dev
      prompt: "Installer Android Studio + outils Android ? [yes/no]"
      default: "no"
      private: false

    - name: install_games
      prompt: "Installer les packages gaming (Steam, Lutris, Wine, ...) ? [yes/no]"
      default: "no"
      private: false

    - name: install_virt
      prompt: "Installer la virtualisation (virt-manager, QEMU) ? [yes/no]"
      default: "no"
      private: false

    - name: install_creative
      prompt: "Installer les outils créatifs (Blender, Krita, CUDA) ? [yes/no]"
      default: "no"
      private: false

    - name: install_ts_web
      prompt: "Parsers treesitter web (svelte, css, js, ts) ? [yes/no]"
      default: "no"
      private: false

    - name: install_ts_go
      prompt: "Parsers treesitter Go ? [yes/no]"
      default: "no"
      private: false

  vars:
    ansible_become_password: "{{ become_password }}"

  # Les rôles sont joués dans un block/always : le secret déposé par
  # sudo_askpass est retiré même si le play échoue en cours de route.
  tasks:
    - name: Provisioning
      block:
        - include_role:
            name: sudo_askpass

        - include_role:
            name: yay

        - include_role:
            name: packages

        - include_role:
            name: dotfiles

        - include_role:
            name: services

        - include_role:
            name: shell

        - include_role:
            name: neovim
          when: install_dev | lower == 'yes'

      always:
        - include_role:
            name: sudo_askpass
            tasks_from: cleanup
