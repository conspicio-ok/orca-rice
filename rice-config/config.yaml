rice:
	version: "1.0"
	profile: "default"

theme:
	name: "gruvbox"
	variant: "dark"
	accent: "#d79921"
	opacity: 0.9
	blur: true
	animations: true

components:
	waybar:
		enabled: true
		position: "top"
		height: 30
		modules:
			workspaces: true
			window_title: true
			clock: true
			battery: true
			network: true
			volume: true
			tray: true

	wofi:
		enabled: true
		mode: "drun"
		width: 400
		height: 300

	dunst:
		enabled: true
		position: "top_right"

	wallpaper:
		path: "~/Pictures/wallpapers/current.jpg"
		mode: "fill"

hyprland:
	gaps:
		inner: 5
		outer: 10
	border:
		size: 2
		active_color: "rgb(d79921)"
		inactive_color: "rgb(3c3836)"

	layouts:
		default: "dwindle"
		available: ["dwindle", "master"]

	animations:
		enabled: true
		speed: 1.0
		bezier: "easeOutQuint"

keybinds:
	mod: "SUPER"
	terminal: "alacritty"
	launcher: "wofi -show drun"
	file_manager: "dolphin"
	browser: "firefox"

widgets:
	system_info: true
	weather: false
	spotify: true
	system_monitor: false
	calendar: true
