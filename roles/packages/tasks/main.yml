---
- name: Installer les packages pacman essentiels
  become: true
  pacman:
    name: "{{ pacman_packages_core }}"
    state: present
    update_cache: true

- name: Installer les packages pacman spécifiques à la machine
  become: true
  pacman:
    name: "{{ pacman_packages_host | default([]) }}"
    state: present
  when: pacman_packages_host | default([]) | length > 0

# Inventaire des paquets installés — sert à filtrer les installations AUR
# (voir aur.yml). Un seul appel, réutilisé par tous les blocs AUR.
- name: Lister les paquets déjà installés
  command: pacman -Qq
  register: pacman_installed
  changed_when: false

- name: Installer les packages AUR spécifiques à la machine
  include_tasks: aur.yml
  vars:
    aur_list: "{{ aur_packages_host | default([]) }}"
    aur_label: "machine"
  when: aur_packages_host | default([]) | length > 0

- name: Installer les packages AUR essentiels
  include_tasks: aur.yml
  vars:
    aur_list: "{{ aur_packages_core }}"
    aur_label: "essentiels"

- name: Installer les packages dev pacman
  become: true
  pacman:
    name: "{{ pacman_packages_dev }}"
    state: present
  when: install_dev | lower == 'yes'

- name: Installer les packages dev AUR
  include_tasks: aur.yml
  vars:
    aur_list: "{{ aur_packages_dev }}"
    aur_label: "dev"
  when: install_dev | lower == 'yes'

- name: Installer les packages pacman Android Dev
  become: true
  pacman:
    name: "{{ pacman_packages_android_dev }}"
    state: present
  when: install_android_dev | lower == 'yes'

- name: Installer Android Studio (AUR)
  include_tasks: aur.yml
  vars:
    aur_list: "{{ aur_packages_android_dev }}"
    aur_label: "Android Dev"
  when: install_android_dev | lower == 'yes'

- name: Activer le dépôt multilib pour le gaming
  become: true
  ini_file:
    path: /etc/pacman.conf
    section: multilib
    option: Include
    value: /etc/pacman.d/mirrorlist
  when: install_games | lower == 'yes'

- name: Installer les packages gaming pacman
  become: true
  pacman:
    name: "{{ pacman_packages_games }}"
    state: present
    update_cache: true
  when: install_games | lower == 'yes'

- name: Installer les packages gaming AUR
  include_tasks: aur.yml
  vars:
    aur_list: "{{ aur_packages_games }}"
    aur_label: "gaming"
  when: install_games | lower == 'yes'

- name: Installer les packages virtualisation
  become: true
  pacman:
    name: "{{ pacman_packages_virt }}"
    state: present
  when: install_virt | lower == 'yes'

- name: Ajouter l'utilisateur au groupe libvirt
  become: true
  user:
    name: "{{ ansible_user }}"
    groups: libvirt
    append: true
  when: install_virt | lower == 'yes'

- name: Installer les packages créatifs
  become: true
  pacman:
    name: "{{ pacman_packages_creative }}"
    state: present
  when: install_creative | lower == 'yes'
