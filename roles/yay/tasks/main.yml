---
# Installe yay ou paru selon l'hôte (variable aur_helper).
#
# makepkg -si appelle `sudo pacman -U` en fin de compilation. Sans TTY,
# cet appel échoue : il passe par le helper askpass (rôle sudo_askpass,
# joué avant celui-ci), transmis par la variable SUDO_ASKPASS.

- name: Vérifier si {{ aur_helper }} est déjà installé
  shell: command -v {{ aur_helper }}
  register: aur_check
  changed_when: false
  failed_when: false

- name: Installer les dépendances pour compiler l'AUR helper
  become: true
  pacman:
    name:
      - git
      - base-devel
    state: present
  when: aur_check.rc != 0

- name: Cloner le dépôt {{ aur_helper }}
  git:
    repo: https://aur.archlinux.org/{{ aur_helper }}.git
    dest: /tmp/{{ aur_helper }}
    depth: 1
  when: aur_check.rc != 0

- name: Compiler et installer {{ aur_helper }}
  command: makepkg -si --noconfirm
  args:
    chdir: /tmp/{{ aur_helper }}
  environment: "{{ aur_env }}"
  when: aur_check.rc != 0

- name: Nettoyer le répertoire temporaire
  file:
    path: /tmp/{{ aur_helper }}
    state: absent
  when: aur_check.rc != 0
