[main]
# gtk-theme desactive : le thema par defaut est Adwaita (clair), donc le demander
# en dark forcait un second parse complet de thema (~20 ms) AVANT
# gtk_session_lock_lock_lock() — soit 20 ms de bureau encore visible.
# Toutes les couleurs visibles sont fixees dans style.css.
# gtk-theme=Adwaita-dark
style=/home/conspicio/.config/gtklock/style.css
modules=powerbar-module;playerctl-module

# %-d : jour sans zero initial (voir date(1))
time-format=%H:%M
date-format=%A %-d %B

# playerctl-module : options exposees = art-size, position, show-hidden
# position — above-clock | under-clock | top-{left,center,right} | bottom-{left,center,right}
position=under-clock
art-size=52
# Pas de retrait automatique en pause : le widget vit tant qu'un lecteur existe
# sur D-Bus (cree sur player-appeared, detruit sur player-vanished). playback-status
# ne pilote que l'icone play/pause. Comportement amont accepte.

# powerbar-module : options verifiees dans le .so
# defauts — poweroff-command=systemctl -i poweroff, reboot-command=systemctl reboot,
#           suspend-command=systemctl suspend
# userswitch-command / logout-command : non definis => boutons absents
# linked-buttons=true regrouperait les boutons en un bloc unique
